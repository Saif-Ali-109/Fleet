name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: multiorm
          POSTGRES_PASSWORD: multiorm
          POSTGRES_DB: multiorch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U multiorm -d multiorch"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Migrate database
        env:
          DATABASE_URL: postgresql://multiorm:multiorm@localhost:5432/multiorch?sslmode=disable
        run: npm run migrate:up

      - name: Run typecheck
        run: npm run typecheck

      - name: Run build
        run: npm run build

      - name: Run tests
        env:
          DATABASE_URL: postgresql://multiorm:multiorm@localhost:5432/multiorch?sslmode=disable
        run: npm test
        continue-on-error: false

      - name: Dry-run smoke (orchestration spine)
        env:
          DATABASE_URL: postgresql://multiorm:multiorm@localhost:5432/multiorch?sslmode=disable
        run: npm run dry -- --repo octocat/Hello-World --issue 1 --interactive=false --no-web