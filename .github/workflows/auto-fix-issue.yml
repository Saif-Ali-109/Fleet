name: Auto-fix opened issue

# Fires the fix fleet the moment a new issue is opened, fully unattended:
# all 3 gates auto-approve (--interactive=false), no web dashboard in CI
# (--no-web). On success this pushes a real branch and opens a PR that
# closes the issue. Requires GH_TOKEN and the opencode CLI's own auth
# secret to already be configured as repo secrets (see README "Prerequisites").

on:
  issues:
    types: [opened]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  # One run per issue at a time; a second "opened" event for the same issue
  # (e.g. someone edits and it re-fires) won't overlap with an in-flight run.
  group: auto-fix-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  auto-fix:
    runs-on: ubuntu-latest
    # Skip issues opened by bots (e.g. this workflow's own PR-close comment,
    # or other automation) to avoid accidental self-triggering loops.
    if: github.event.issue.user.type != 'Bot'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Install opencode CLI
        run: |
          # Adjust to however you provision opencode on a fresh runner
          # (README "Prerequisites" — opencode CLI >= v1.18.7 on PATH).
          npm install -g opencode-ai
          opencode --version

      - name: Authenticate opencode CLI
        env:
          OPENCODE_AUTH: ${{ secrets.OPENCODE_AUTH }}
        run: |
          # Seed opencode's auth.json from the repo secret rather than an
          # interactive `opencode auth login` (not possible on a runner).
          # Adjust the path/format to match how your OPENCODE_AUTH secret
          # is actually structured.
          mkdir -p ~/.local/share/opencode
          echo "$OPENCODE_AUTH" > ~/.local/share/opencode/auth.json

      - name: Authenticate gh CLI
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: gh auth status

      - name: Run the fix fleet
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          npm start -- \
            --repo "${{ github.repository }}" \
            --issue "${{ github.event.issue.number }}" \
            --interactive=false \
            --no-web
