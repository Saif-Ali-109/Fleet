name: Auto-fix opened issue

# Fires the fix fleet the moment a new issue is opened, fully unattended:
# gates auto-approve (no interactive mode exists), no web dashboard in CI
# (--no-web). On success this pushes a real branch and opens a PR that
# closes the issue. Requires GH_TOKEN plus at least one provider key
# (GEMINI_API_KEY; OPENROUTER_API_KEY optional as fallback) configured as
# repo secrets.

on:
  issues:
    types: [opened]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  # One run per issue at a time; a second "opened" event for the same issue
  # (e.g. someone edits and it re-fires) won't overlap with an in-flight run.
  group: auto-fix-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  auto-fix:
    runs-on: ubuntu-latest
    # Skip issues opened by bots (e.g. this workflow's own PR-close comment,
    # or other automation) to avoid accidental self-triggering loops.
    if: github.event.issue.user.type != 'Bot'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: multiorm
          POSTGRES_PASSWORD: multiorm
          POSTGRES_DB: multiorch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U multiorm -d multiorch"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Migrate database
        env:
          DATABASE_URL: postgresql://multiorm:multiorm@localhost:5432/multiorch?sslmode=disable
        run: npm run migrate:up

      - name: Authenticate gh CLI
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          gh auth status
          gh auth setup-git

      - name: Run the fix fleet
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          DATABASE_URL: postgresql://multiorm:multiorm@localhost:5432/multiorch?sslmode=disable
          SOR_SIGNING_KEY: ${{ secrets.SOR_SIGNING_KEY || 'ci-dummy-signing-key' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          npm start -- \
            --repo "${{ github.repository }}" \
            --issue "${{ github.event.issue.number }}" \
            --no-web
