name: Check agent config is up to date

# agents/*.md is the single source of truth for every CLI agent's config
# (.fleet/opencode.json, .fleet/claude/**, .fleet/codex/**). This workflow
# fails if any generated file was hand-edited, or if agents/*.md (or the
# model overrides in manager/models.json) changed without regenerating,
# so they can never silently drift apart.

on:
  push:
    paths:
      - "agents/**"
      - ".fleet/**"
      - "manager/models.json"
      - "scripts/**"
      - ".github/workflows/check-agent-config.yml"
  pull_request:
    paths:
      - "agents/**"
      - ".fleet/**"
      - "manager/models.json"
      - "scripts/**"
      - ".github/workflows/check-agent-config.yml"

jobs:
  check-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Verify all generated configs match agents/*.md
        run: npm run check:config
